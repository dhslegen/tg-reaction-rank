# 单实例部署：同一个 Telegram 登录状态绝不能被两个进程同时使用，不要加 replicas 或横向扩容。
services:
  app:
    # 使用预构建镜像时把 TGRANK_IMAGE 设为 ghcr.io/<你的 GitHub 用户名>/tg-reaction-rank:latest；
    # 从源码运行则用 docker compose up -d --build
    image: ${TGRANK_IMAGE:-tg-reaction-rank:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内固定监听 8000，宿主机端口由 .env 的 PORT 决定
      PORT: "8000"
      DATA_DIR: /app/data
    ports:
      # 默认只监听本机，由同机的反向代理提供 HTTPS；需要从别处直接访问时去掉 127.0.0.1:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
