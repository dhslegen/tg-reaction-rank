[project]
name = "tg-reaction-rank"
version = "0.1.0"
description = "自托管的 Telegram 群消息表情反应排行服务"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
    "python-multipart>=0.0.20",
    "telethon>=1.45,<2",
    "python-socks[asyncio]>=2.7",
    "apscheduler>=3.11,<4",
    "cryptography>=45",
    "ijson>=3.4",
    "pydantic>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
